*{box-sizing:border-box}body{margin:0;background:#121b30;color:#f4f5ff;font:14px system-ui,"Hiragino Kaku Gothic ProN",sans-serif}header{background:#26375b;padding:20px}header h1{margin:0 0 8px;font-size:25px}header p{margin:0;line-height:1.65;color:#d1dcf0}main{max-width:1350px;margin:auto;padding:12px}.bar{position:sticky;top:0;z-index:3;background:#121b30ed;padding:9px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}input,button{font:inherit;border-radius:9px;padding:10px;border:1px solid #6d7e9c}input{background:white;color:#18233a;flex:1;min-width:150px}button{background:#30466d;color:#fff;cursor:pointer}.selected{background:#846440}#gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.tile{background:#25334c;border-radius:13px;overflow:hidden;border:1px solid #3d506d}.photo{padding:0;border:0;border-radius:0;width:100%;height:260px;background-color:#303d57;background-image:linear-gradient(45deg,#29344c 25%,transparent 25%),linear-gradient(-45deg,#29344c 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#29344c 75%),linear-gradient(-45deg,transparent 75%,#29344c 75%);background-size:22px 22px;background-position:0 0,0 11px,11px -11px,-11px 0}.photo img{width:100%;height:100%;object-fit:contain;object-position:center bottom}.meta{padding:10px}.meta b{display:block;font-size:15px}.meta small{display:block;color:#b1bfd9;font-size:10px;margin:4px 0;overflow-wrap:anywhere}.meta button{font-size:11px;padding:6px}#viewer{display:none;position:fixed;inset:0;z-index:10;background:#080d1af2;flex-direction:column;padding:12px;gap:12px}#viewer.open{display:flex}.vhead,.vfoot{display:flex;justify-content:space-between;align-items:center;gap:10px}.vimage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.vimage img{width:100%;height:100%;object-fit:contain;max-height:calc(100dvh - 140px)}.vfoot{justify-content:center}.vfoot a{color:#bed6ff}.muted{color:#b9c5da;font-size:12px}footer{padding:20px;color:#b8c7e2}@media(max-width:520px){#gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.photo{height:230px}.meta{padding:8px}.meta b{font-size:13px}}
</style></head><body><header><h1>SR画像一覧｜全54人</h1><p>ゲームに保存されているSR立ち絵画像を一覧で確認できます。画像をタップすると拡大します。「候補にする」はこのブラウザだけに保存され、ゲームには影響しません。</p></header><main><div class="bar"><input id="search" type="search" placeholder="人物名・IDで検索"><button id="only">候補のみ</button><button id="clear">解除</button><span class="muted" id="count"></span></div><div id="gallery"></div><footer>SR専用画像54人分。SR区分の試作ユニット4件は専用画像がなく、この一覧には表示していません。</footer></main><div id="viewer" role="dialog" aria-modal="true"><div class="vhead"><strong id="caption"></strong><button id="close">閉じる</button></div><div class="vimage"><img id="big" alt="拡大画像"></div><div class="vfoot"><button id="prev">前へ</button><span id="position"></span><button id="next">次へ</button><a id="imageLink" target="_blank" rel="noopener">画像を開く</a></div></div>

ent.getElementById(id);let favs=new Set(),list=[],index=0;const k="yoiboshi-sr-gallery-favs";

function render(){const q=E("search").value.toLowerCase().trim(),only=E("only").classList.contains("selected");list=data.filter(x=>(!q||x.name.toLowerCase().includes(q)||x.id.includes(q))&&(!only||favs.has(x.id)));E("gallery").replaceChildren();for(const a of list){const tile=document.createElement("article");tile.className="tile";const photo=document.createElement("button");photo.className="photo";photo.setAttribute("aria-label",a.name+"を拡大");const img=document.createElement("img");img.src=a.img;img.alt=a.name+" SR画像";img.loading="lazy";img.onerror=()=>img.alt="読込エラー";photo.append(img);photo.onclick=()=>{index=list.indexOf(a);view()};const meta=document.createElement("div");meta.className="meta";const name=document.createElement("b");name.textContent=a.name;const label=document.createElement("small");label.textContent=a.id;const fav=document.createElement("button");function labelFav(){fav.textContent=favs.has(a.id)?"★ 候補":"☆ 候補にする";fav.classList.toggle("selected",favs.has(a.id))}labelFav();fav.onclick=()=>{favs.has(a.id)?favs.delete(a.id):favs.add(a.id);try{localStorage.setItem(k,JSON.stringify([...favs]))}catch(e){}if(only)render();else labelFav()};meta.append(name,label,fav);tile.append(photo,meta);E("gallery").append(tile)}E("count").textContent=list.length+" / 54人"}
function view(){const x=list[index];if(!x)return;E("viewer").classList.add("open");E("caption").textContent=x.name;E("big").src=x.img;E("big").alt=x.name+" SR画像";E("imageLink").href=x.img;E("position").textContent=(index+1)+" / "+list.length}
function move(n){if(!list.length)return;index=(index+n+list.length)%list.length;view()}
E("search").oninput=render;E("only").onclick=()=>{E("only").classList.toggle("selected");render()};E("clear").onclick=()=>{E("search").value="";E("only").classList.remove("selected");render()};E("close").onclick=()=>E("viewer").classList.remove("open");E("prev").onclick=()=>move(-1);E("next").onclick=()=>move(1);document.addEventListener("keydown",e=>{if(!E("viewer").classList.contains("open"))return;if(e.key==="Escape")E("close").click();if(e.key==="ArrowRight")move(1);if(e.key==="ArrowLeft")move(-1)});render();

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172238"><title>宵星｜5人の会話演技プレビュー</title><link rel="stylesheet" href="css/character_acting_v1.css?v=20261104-2"><style>
*{box-sizing:border-box}body{margin:0;background:#101a2c;color:#f0eef8;font-family:system-ui,'Hiragino Kaku Gothic ProN',sans-serif}main{max-width:1120px;margin:auto;padding:18px}h1{font-size:clamp(20px,3vw,29px);margin:12px 0 6px}.summary{color:#ccd6ec;line-height:1.7;font-size:14px}.hint{font-size:12px;color:#a9bdd5}.stage-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:16px;margin:20px 0}.acting-demo-card{border:1px solid #51617b;background:#1c2941;border-radius:16px;overflow:hidden}.head{padding:14px 15px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}.head strong{font-size:17px}.head small{color:#d0dcf2}.acting-demo-stage{position:relative;height:290px;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#c2b9ce,#65738b 75%,#45556d)}.acting-demo-stage .expr-character-layer{width:100%;height:100%;position:relative}.acting-demo-stage img{width:100%;height:100%;display:block;object-fit:contain;object-position:center 20%}.controls{padding:10px 12px 14px;display:flex;flex-wrap:wrap;gap:5px}.controls button,.comparison button{border:1px solid #6a7f9b;border-radius:20px;background:#34445e;color:white;padding:7px 10px;cursor:pointer;font-size:12px}.controls button[aria-pressed=true],.comparison button[aria-pressed=true]{background:#dac3ef;border-color:#dac3ef;color:#222b3b}.status{padding:0 12px 13px;font-size:12px;color:#b6c9dc;min-height:35px}.comparison{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 0}.static .expr-character-layer > img{animation:none!important;transform:none!important;will-change:auto!important}.notes{border-left:3px solid #b995e4;padding:8px 14px;background:#26334e;line-height:1.75;font-size:13px}
</style></head><body><main><h1>宵星の契約者｜会話演技 5人先行プレビュー</h1><p class="summary">採用済みの顔・衣装を描き直さず、会話画面の<strong>立ち絵全体</strong>に控えめな呼吸・傾き・後退を追加します。新しい腕や手のポーズはまだありません。</p><div class="comparison"><span>表示：</span><button id="active" aria-pressed="true" onclick="setMotion(true)">動きを確認</button><button id="still" aria-pressed="false" onclick="setMotion(false)">停止して比較</button></div><div id="grid" class="stage-grid"></div><p class="notes">「通常」「笑顔」「怒り」「悲しみ」「驚き」「照れ」を切り替えられます。表情キーに応じた動きの検証であり、表示される顔の差分画像を作ったものではありません。真琴は正式差し替え前の採用候補WebPを使用しています。動きが苦手な方向けにOSの「動きを減らす」設定にも対応しています。</p><p class="hint">このページはテスト専用です。ゲームのセーブ・本編・画像を変更しません。</p></main><script>
const PEOPLE=[['momoka','桜井ももか','assets/ART_V2/upper_body/momoka.webp'],['milku','白石みるく','assets/ART_V2/upper_body/milku.webp'],['reina','黒瀬玲奈','assets/ART_V2/upper_body/reina.webp'],['nagi','白峰凪','assets/ART_V2/upper_body/nagi.webp'],['makoto','早瀬真琴（候補）','assets/ART_V2/style_candidates/makoto_v1_upper.webp']];
const FACES=[['normal','通常'],['smile','笑顔'],['pout','怒り'],['sad','悲しみ'],['surprise','驚き'],['blush','照れ']];
document.getElementById('grid').innerHTML=PEOPLE.map(([id,name,path])=>`<section class="acting-demo-card" data-id="${id}"><div class="head"><strong>${name}</strong><small>P0 / 演技試作</small></div><div class="acting-demo-stage"><div class="expr-character-layer" data-person-id="${id}" data-expression="normal"><img src="${path}" alt="${name}の立ち絵"></div></div><div class="controls">${FACES.map(([face,label])=>`<button type="button" data-face="${face}" aria-pressed="${face==='normal'}" onclick="faceChange('${id}','${face}')">${label}</button>`).join('')}</div><div class="status">通常：静かな呼吸</div></section>`).join('');
const INFO={normal:'通常：静かな呼吸',smile:'笑顔：少し身を乗り出す',pout:'怒り：反発するように体を傾ける',sad:'悲しみ：肩を落とすように姿勢が沈む',surprise:'驚き：一歩引くように反応する',blush:'照れ：少し身を引く'};
function faceChange(id,face){const card=document.querySelector(`[data-id="${id}"]`);const layer=card.querySelector('.expr-character-layer');layer.dataset.expression=face;card.querySelectorAll('button[data-face]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.face===face)));card.querySelector('.status').textContent=INFO[face];const img=layer.querySelector('img');img.style.animation='none';void img.offsetWidth;img.style.removeProperty('animation');}
function setMotion(on){document.getElementById('grid').classList.toggle('static',!on);document.getElementById('active').setAttribute('aria-pressed',String(on));document.getElementById('still').setAttribute('aria-pressed',String(!on));}
</script></body></html>

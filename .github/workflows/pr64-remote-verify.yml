name: PR64 independent remote candidate QA
on:
  push:
    branches:
      - art/20261111-pink-underlayer-standee
    paths:
      - .github/workflows/pr64-remote-verify.yml
permissions:
  contents: write
jobs:
  verify-downloaded-github-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify file freshly retrieved from GitHub
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib, subprocess
          p=Path("assets/provisional/2026-11-11_pink_underlayer_standee/full_body/pink_underlayer_black_street_v2_transparency_CANDIDATE.png")
          d=p.read_bytes()
          expected_sha256="02977e9175e79b945ea67e08669622cd8ac08b4fc282c19dc9fe268aa4b9f175"
          expected_blob="53b5f76211945fb6dfda8d1122a6faf374d95e2d"
          actual_sha256=hashlib.sha256(d).hexdigest()
          actual_blob=subprocess.check_output(["git","hash-object",str(p)], text=True).strip()
          assert actual_sha256==expected_sha256,(actual_sha256,expected_sha256)
          assert actual_blob==expected_blob,(actual_blob,expected_blob)
          with Image.open(p) as im:
              assert im.size==(1024,1536) and im.mode=="RGBA"
              a=im.getchannel("A")
              assert a.getextrema()==(0,255)
              corners=[a.getpixel((x,y)) for x,y in [(0,0),(1023,0),(0,1535),(1023,1535)]]
              assert corners==[0,0,0,0], corners
              freq=a.histogram()
              transparent=freq[0]; total=im.width*im.height
              print("QA PASS: GitHub re-download SHA-256", actual_sha256)
              print("QA PASS: GitHub blob", actual_blob)
              print("QA PASS: RGBA", im.size, "alpha",a.getextrema(),"fully-transparent-pixel-percent",round(transparent/total*100,2))
              print("NOTE: preview/perimeter quality and game display remain unverified")
          PY
      - name: Remove one-shot QA workflow (leave no game code changes)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- ".github/workflows/pr64-remote-verify.yml"
          git commit -m "PR #64: finish independent candidate hash QA"
          git push origin HEAD:art/20261111-pink-underlayer-standee

name: Import Ruri battle BGM (temporary)
on:
  push:
    branches: [feature/ruri-battle-bgm-20261109]
    paths:
      - .github/workflows/import-ruri-bgm-temporary.yml
permissions:
  contents: write
jobs:
  import-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch user-provided audio and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/audio
          curl -fL --retry 2 --connect-timeout 15 --max-time 120 \
            'https://yoiboshi-contract.floot.app/_cdn/static/306fe137-62b6-4cdb-a9f3-40701a6462f9-The_Celestial_Loom.mp3' \
            -o assets/audio/ruri_boss.mp3
          echo '5f7a7e4043449495b4b63c630f41ff061f80aec755623755f86135d7a9741b24  assets/audio/ruri_boss.mp3' | sha256sum -c -
      - name: Commit verified audio to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/audio/ruri_boss.mp3
          git diff --cached --quiet || git commit -m 'Add The Celestial Loom for Ruri boss battle'
          git push origin HEAD:feature/ruri-battle-bgm-20261109

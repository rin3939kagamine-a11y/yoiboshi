name: Temporary immersive combat QA
on:
  push:
    branches: [feature/immersive-battle-in-scene-20261109]
    paths:
      - .github/workflows/qa-immersive-battle-temporary.yml
      - .github/qa/immersive-battle.cjs
      - js/battle_immersive_v1.js
      - css/battle_immersive_v1.css
      - index.html
permissions:
  contents: read
jobs:
  chromium-layout:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright API
        run: npm install --no-save --no-package-lock playwright@1.57.0
      - name: Test five viewport sizes and actor stability
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/battle-test.log 2>&1 &
          sleep 2
          node .github/qa/immersive-battle.cjs
      - name: Save browser screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: immersive-battle-screenshots
          path: qa-*.png
          if-no-files-found: ignore

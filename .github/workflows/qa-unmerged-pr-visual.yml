name: Audit open-PR character artwork visual overlaps
on:
  push:
    branches:
      - qa/20261114-unmerged-character-visual-audit
    paths:
      - "tools/qa/unmerged_pr_visual_audit.py"
      - ".github/workflows/qa-unmerged-pr-visual.yml"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare Pillow
        run: python -m pip install pillow==11.3.0
      - name: Read current open PR artwork and generate proof sheets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/qa/unmerged_pr_visual_audit.py
      - name: Commit visual audit output only on QA branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/unmerged_20261114/
          if git diff --cached --quiet; then
            echo 'Audit unchanged'
          else
            git commit -m 'QA inventory and visual contact sheets for open PR standees'
            git push origin HEAD:qa/20261114-unmerged-character-visual-audit
          fi

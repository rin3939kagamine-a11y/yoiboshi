name: QA - Singles12 adopted heroines stage1
on:
  push:
    branches:
      - feature/20261115-singles12-stage1
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage1:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install artwork and browser QA tools
        run: |
          python -m pip install pillow==11.3.0 numpy==2.2.6 playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Syntax and source validation
        run: |
          node --check js/game.js
          node --check js/heroines_v0910.js
          node --check js/heroines_v0910_wire.js
          node --check js/character_depth_v1.js
          python -m py_compile tools/qa/build_singles12_stage1_assets.py tools/qa/singles12_stage1_smoke.py
      - name: Verify 12 PNG blobs, preserve nine clean originals, conservatively clean halo, create 24 lossless crop icons
        run: python tools/qa/build_singles12_stage1_assets.py
      - name: Commit image binaries to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for id in takahashi_ayano tanaka_mio arai_shiori ono_yuina maeda_akane fujita_sui goto_satoko nakajima_kazumi harada_kyoko ogawa_rina ishida_yuna morita_mitsuki; do
            git add "assets/ART_V2/full_body/${id}.png" "assets/ART_V2/upper_body/${id}.webp" "assets/ART_V2/face_icons/${id}.webp"
          done
          if git diff --cached --quiet; then
            echo 'Images are already identical to generated assets'
          else
            git commit -m 'art: singles12 承認素材12人の全身と切り抜き24点を登録'
            git fetch origin feature/20261115-singles12-stage1
            git rebase origin/feature/20261115-singles12-stage1
            git push origin HEAD:feature/20261115-singles12-stage1
          fi
      - name: Real-browser q6, interactions, bonds, save migration and gacha rate invariants
        run: python tools/qa/singles12_stage1_smoke.py
      - name: Upload source-vs-cleaned and browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-singles12-stage1
          path: qa_artifacts/singles12_stage1/
          if-no-files-found: warn

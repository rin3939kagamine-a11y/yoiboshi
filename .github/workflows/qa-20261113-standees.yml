name: 2026-11-13 independent standee asset QA
on:
  push:
    branches:
      - qa/20261113-independent-standee-check
    paths:
      - .github/workflows/qa-20261113-standees.yml
permissions:
  contents: write
jobs:
  verify-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image inspector
        run: python -m pip install --quiet pillow
      - name: Independently redownload and inspect PR PNG files
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, io, json, os, urllib.request
          from PIL import Image
          base = 'https://raw.githubusercontent.com/rin3939kagamine-a11y/yoiboshi/'
          items = [
              ('pr64_v1', '4788202e943344e48f2a9b45920042071f5c0f19', 'assets/provisional/2026-11-11_pink_underlayer_standee/full_body/pink_underlayer_black_street_v1.png', 'edba2b78575fd1ebfb713c47729ef35aeb24b68ff4e65ccb263842cf18099e4c', 'bd21d625502f298b862fa954276e04eea9551b8b'),
              ('pr64_v2', '4788202e943344e48f2a9b45920042071f5c0f19', 'assets/provisional/2026-11-11_pink_underlayer_standee/full_body/pink_underlayer_black_street_v2_transparency_CANDIDATE.png', '02977e9175e79b945ea67e08669622cd8ac08b4fc282c19dc9fe268aa4b9f175', '53b5f76211945fb6dfda8d1122a6faf374d95e2d'),
              ('pr81', 'ad61f756f3d8e0ec933dc68ada7a9979c4e54f1f', 'assets/character_candidates/2026-11-12_rust_red_standee/full_body.png', 'c87f6a6efcd54dbd4ae5e4c4cb3c1956be92793f8ba3c25713df7e3f61eb349e', 'cb29e7103f5aa37b912a23b48b4cf9ce0b6fa72c'),
              ('pr82', '9aedf446ee3a7dabff0fe1bd9ba0d13e9ffb44f9', 'assets/character_candidates/2026-11-12_brown_ponytail_white_lace/brown_ponytail_white_lace_full_body.png', '9bcb3d095fbbcf0ba53152d2b244df14056766e64ac946e01ebcb5b67f00f486', '07069993185031ea93823f881c51a924c96b63c9'),
          ]
          os.makedirs('qa/previews/2026-11-13', exist_ok=True)
          report = {}
          for name, ref, path, expected_sha256, expected_blob in items:
              url = base + ref + '/' + path
              with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent':'yoiboshi-QA'}), timeout=60) as f:
                  content = f.read()
              sha256 = hashlib.sha256(content).hexdigest()
              gitblob = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
              im = Image.open(io.BytesIO(content))
              im.load()
              alpha = im.getchannel('A') if 'A' in im.getbands() else None
              hist = alpha.histogram() if alpha else None
              stats = {
                  'file': path, 'ref': ref, 'bytes': len(content),
                  'sha256':sha256, 'sha256_expected':expected_sha256, 'sha256_matches':sha256 == expected_sha256,
                  'git_blob_sha':gitblob,'git_blob_expected':expected_blob,'git_blob_matches':gitblob == expected_blob,
                  'format':im.format,'mode':im.mode,'size':list(im.size),
                  'alpha_min_max': list(alpha.getextrema()) if alpha else None,
                  'fully_transparent_pixels':hist[0] if hist else 0,
                  'partially_transparent_pixels':sum(hist[1:255]) if hist else 0,
                  'fully_opaque_pixels':hist[255] if hist else im.width * im.height,
                  'alpha_bounding_box':list(alpha.getbbox()) if alpha else [0,0,*im.size],
              }
              report[name] = stats
              print('QA_RESULT ' + json.dumps({'name':name,**stats},ensure_ascii=False), flush=True)
              assert sha256 == expected_sha256, name + ' SHA256 mismatch'
              assert gitblob == expected_blob, name + ' git blob mismatch'
              assert im.size == (1024,1536), name + ' dimensions mismatch'
              if name != 'pr64_v1':
                  assert im.mode == 'RGBA', name + ' not RGBA'
                  assert hist and hist[0] > 0, name + ' no fully transparent pixels'
              fg=im.convert('RGBA')
              halfsize=(384,576)
              downsized=fg.resize(halfsize, Image.Resampling.LANCZOS)
              panel=Image.new('RGB',(768,576),'#12131a')
              left=Image.new('RGBA',halfsize,'#12131a');left.alpha_composite(downsized)
              right=Image.new('RGBA',halfsize,'#e8ebee');right.alpha_composite(downsized)
              panel.paste(left.convert('RGB'),(0,0));panel.paste(right.convert('RGB'),(384,0))
              panel.save(f'qa/previews/2026-11-13/{name}_dark_light.jpg',quality=87,optimize=True)
              for region, crop in [
                  ('hair',(170,0,760,650)),
                  ('feet',(210,1020,780,1536)),
              ]:
                  cropped=fg.crop(crop)
                  bg=Image.new('RGBA',cropped.size,'#12131a');bg.alpha_composite(cropped)
                  bg.convert('RGB').resize((885,round(bg.height*885/bg.width)),Image.Resampling.LANCZOS).save(f'qa/previews/2026-11-13/{name}_{region}.jpg',quality=90,optimize=True)
          with open('qa/previews/2026-11-13/report.json','w') as f:
              json.dump(report,f,ensure_ascii=False,indent=2)
          print('INDEPENDENT QA COMPLETED FOR 4 PNG FILES')
          PY
      - name: Commit preview-only outputs to isolated QA branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/previews/2026-11-13/
          git diff --staged --quiet || (git commit -m "QA: independent hashes and dark/light image previews" && git push)

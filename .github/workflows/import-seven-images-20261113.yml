name: Import seven original PNG character candidates
on:
  push:
    branches:
      - assets/seven-character-candidates-20261113
    paths:
      - .github/workflows/import-seven-images-20261113.yml
permissions:
  contents: write
jobs:
  import-original-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover original Git blobs and commit seven PNGs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, json, base64, hashlib, urllib.request
          from pathlib import Path
          files = [
          ("赤薔薇と金刺繍のチャイナドレス美女.png","d6c6bc41a0a5092584b7fd392fcbe4de4fafc2d6"),
          ("ゴシックメイドの華麗な全身ポートレート.png","0f16b6b9bd9aa413afbfd74e0bfb2c3d1bde1245"),
          ("クールなオフショルダーストリートスタイル女子.png","b849b5a29df148f608c6c87d353e8d3cc98032e0"),
          ("アイスコーヒーを持つ冬ニットの少女.png","8665287713dcf5e11735ac025dda005e3472c96a"),
          ("紫の瞳のクールな革ジャン美女.png","af7869808f0cefd8cb332515aa009d11a2b517af"),
          ("ゴシック中華ロリータの双子結び少女.png","e27b463bc7c20aa00046c6667c07750ed35c0ac9"),
          ("白 ivoryロリータの少女レンダー.png","61537c4f682433b75900e09e64998de4d6388f81"),
          ]
          folder = Path('docs/new_character_ideas/2026-11-13_7人案')
          folder.mkdir(parents=True, exist_ok=True)
          for name, sha in files:
              url = f'https://api.github.com/repos/{os.environ["GH_REPO"]}/git/blobs/{sha}'
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = json.load(resp)
              if body.get('encoding') != 'base64':
                  raise ValueError('Unexpected encoding '+str(body.get('encoding')))
              raw = base64.b64decode(body['content'])
              actual = hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\x00'+raw).hexdigest()
              if actual != sha:
                  raise ValueError(f'Git blob SHA mismatch for {name}: {actual}')
              (folder/name).write_bytes(raw)
              print(f'Preserved {name}: {len(raw)} bytes; git SHA {sha}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'docs/new_character_ideas/2026-11-13_7人案/'
          git rm -- '.github/workflows/import-seven-images-20261113.yml'
          git commit -m '2026-11-13 新キャラクター立ち絵候補7枚を追加（原本PNG）'
          git push origin HEAD:assets/seven-character-candidates-20261113

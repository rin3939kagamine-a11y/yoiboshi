name: QA - Chapter 18 end-to-end

on:
  pull_request:
    paths:
      - 'js/chapter18_v0501.js'
      - 'js/game.js'
      - 'js/investigation.js'
      - 'index.html'
      - 'tools/qa/chapter18_real_smoke.py'
      - '.github/workflows/chapter18-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chapter18:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check all JavaScript and test syntax
        run: |
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          python -m py_compile tools/qa/chapter18_real_smoke.py
      - name: Install Chromium test environment
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Play q103 through q108 in the actual browser
        run: python tools/qa/chapter18_real_smoke.py
      - name: Preserve browser result and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter18-q103-q108
          path: qa_artifacts/chapter18/
          if-no-files-found: warn

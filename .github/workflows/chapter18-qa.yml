name: QA - Chapter 18 end-to-end

on:
  pull_request:
    paths:
      - 'js/chapter18_v0501.js'
      - 'js/game.js'
      - 'js/investigation.js'
      - 'index.html'
      - 'tools/qa/chapter18_real_smoke.py'
      - '.github/workflows/chapter18-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chapter18:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check all JavaScript and test syntax
        run: |
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          python -m py_compile tools/qa/chapter18_real_smoke.py
      - name: Install Chromium test environment
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify approved Makoto assets against existing checksum QA
        run: |
          python -m pip install Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib
          tests={
            'full':((1024,1536),'ad6e4f1b5e983270a2226432b20d2d7c64f1f5ed71fd9010b2cbacde6a1c3f83'),
            'upper':((665,820),'f0dffeaf7f2c4f370e017408e070d1a0d558cf9432fb2ab5552455ab1e9959dd')
          }
          for kind,(size,digest) in tests.items():
              path=Path(f'assets/ART_V2/style_candidates/makoto_v1_{kind}.webp')
              image=Image.open(path)
              assert image.size==size and image.mode=='RGBA'
              assert image.getchannel('A').getextrema()==(0,255)
              assert hashlib.sha256(path.read_bytes()).hexdigest()==digest
          print('PASS: existing Makoto style assets unchanged')
          PY
      - name: Play q103 through q108 in the actual browser
        run: python tools/qa/chapter18_real_smoke.py
      - name: Preserve browser result and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter18-q103-q108
          path: qa_artifacts/chapter18/
          if-no-files-found: warn

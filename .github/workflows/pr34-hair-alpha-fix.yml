name: PR34 - Fix transparent hair gaps (one shot)
on:
  push:
    branches:
      - assets/animal-ear-trio-standees-20261108
    paths:
      - .github/workflows/pr34-hair-alpha-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-alpha:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out PR #34 branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: assets/animal-ear-trio-standees-20261108
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image-processing dependencies
        run: python -m pip install pillow numpy scipy opencv-python-headless
      - name: Fix hair transparency and create dark-background QA images
        run: python tools/qa/pr34_hair_transparency_fix.py
      - name: Commit two v2 assets and two QA previews to the same PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/character_candidates/2026-11-08_animal_ear_trio/*_v2.png
          git add assets/character_candidates/2026-11-08_animal_ear_trio/qa_dark/*.jpg
          git diff --cached --check
          git commit -m "assets: fix white hair pockets in bunny and leopard transparent standees"
          git push origin HEAD:assets/animal-ear-trio-standees-20261108

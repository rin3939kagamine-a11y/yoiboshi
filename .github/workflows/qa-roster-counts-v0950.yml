name: QA - legacy roster assertions after v0950
on:
  pull_request:
    paths:
      - '.github/workflows/qa-roster-counts-v0950.yml'
      - 'tools/qa/heroines_v0500_smoke.py'
      - 'tools/qa/concept_id_migration_smoke.py'
      - 'tools/qa/character_depth_real_smoke.py'
      - 'tools/qa/fujimiya_shion_smoke.py'
      - 'tools/qa/nagasawa_mayu_smoke.py'
      - 'tools/qa/adopted20_stage2_smoke.py'
  push:
    branches:
      - qa/20261116-roster-counts-after-pr114
      - main
    paths:
      - '.github/workflows/qa-roster-counts-v0950.yml'
      - 'tools/qa/heroines_v0500_smoke.py'
      - 'tools/qa/concept_id_migration_smoke.py'
      - 'tools/qa/character_depth_real_smoke.py'
      - 'tools/qa/fujimiya_shion_smoke.py'
      - 'tools/qa/nagasawa_mayu_smoke.py'
      - 'tools/qa/adopted20_stage2_smoke.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy-roster-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser QA dependencies
        run: |
          python -m pip install 'pillow==11.3.0' 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Check updated test grammar
        run: |
          python -m py_compile \
            tools/qa/heroines_v0500_smoke.py \
            tools/qa/concept_id_migration_smoke.py \
            tools/qa/character_depth_real_smoke.py \
            tools/qa/fujimiya_shion_smoke.py \
            tools/qa/nagasawa_mayu_smoke.py \
            tools/qa/adopted20_stage2_smoke.py
      - name: Execute all six updated tests without suppressing any failures
        shell: bash
        run: |
          failures=0
          for test in \
            tools/qa/heroines_v0500_smoke.py \
            tools/qa/concept_id_migration_smoke.py \
            tools/qa/character_depth_real_smoke.py \
            tools/qa/fujimiya_shion_smoke.py \
            tools/qa/nagasawa_mayu_smoke.py \
            tools/qa/adopted20_stage2_smoke.py
          do
            echo "::group::${test}"
            if python "${test}"; then
              echo "PASS ${test}"
            else
              echo "::error::FAIL ${test}"
              failures=$((failures+1))
            fi
            echo "::endgroup::"
          done
          echo "Failed tests: ${failures}"
          test "${failures}" -eq 0

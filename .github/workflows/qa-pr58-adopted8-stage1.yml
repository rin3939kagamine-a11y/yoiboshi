name: QA - PR58 eight approved heroines stage1
on:
  push:
    branches:
      - feature/20261115-pr58-approved8-stage1
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage1:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PNG and browser QA tools
        run: |
          python -m pip install pillow==11.3.0 numpy==2.2.6 playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Syntax and source validation
        run: |
          node --check js/game.js
          node --check js/heroines_v0880.js
          node --check js/heroines_v0880_wire.js
          node --check js/character_depth_v1.js
          python -m py_compile tools/qa/build_pr58_stage1_assets.py tools/qa/pr58_stage1_smoke.py
      - name: Validate originals, conservatively check only Iori exterior smoke; preserve other seven, create lossless crop icons
        run: python tools/qa/build_pr58_stage1_assets.py
      - name: Commit exact artwork and generated crops to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for id in kawamura_shizuku ito_ruri okada_misaki sasaki_sara yamada_yuri shimizu_kotone fujii_kanon kobayashi_iori; do
            git add "assets/ART_V2/full_body/${id}.png" "assets/ART_V2/upper_body/${id}.webp" "assets/ART_V2/face_icons/${id}.webp"
          done
          if git diff --cached --quiet; then
            echo 'No artwork changes needed; existing artifacts are deterministic'
          else
            git commit -m 'art: PR58承認済み8人の安全な輪郭処理と切り抜きアイコン16点を登録'
            git fetch origin feature/20261115-pr58-approved8-stage1
            git rebase origin/feature/20261115-pr58-approved8-stage1
            git push origin HEAD:feature/20261115-pr58-approved8-stage1
          fi
      - name: Test real browser, q6 gate, interactions, bonds, image status, save and gacha invariants
        run: python tools/qa/pr58_stage1_smoke.py
      - name: Upload original-vs-cleaned matte and browser audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-pr58-stage1
          path: qa_artifacts/pr58_stage1/
          if-no-files-found: warn

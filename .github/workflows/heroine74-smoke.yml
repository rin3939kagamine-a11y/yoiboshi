name: QA - 74 heroines and mobile views
on:
  push:
    branches: [main]
    paths:
      - 'tools/qa/heroine74_smoke.py'
      - '.github/workflows/heroine74-smoke.yml'
  workflow_run:
    workflows: ["Generate 74 heroine WebP assets"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image and browser test packages
        run: |
          python -m pip install pillow==11.3.0 playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Validate image assets and browser state
        run: python tools/qa/heroine74_smoke.py
      - name: Store screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heroine74-mobile-qa
          path: qa_artifacts/heroine74/
          if-no-files-found: warn

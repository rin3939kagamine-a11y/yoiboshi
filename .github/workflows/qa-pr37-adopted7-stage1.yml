name: QA - PR37 seven adopted heroines stage1
on:
  push:
    branches:
      - feature/20261115-pr37-adopted7-stage1
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage1:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PNG and browser QA tools
        run: |
          python -m pip install pillow==11.3.0 numpy==2.2.6 playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Syntax and source validation
        run: |
          node --check js/game.js
          node --check js/heroines_v0900.js
          node --check js/heroines_v0900_wire.js
          node --check js/character_depth_v1.js
          python -m py_compile tools/qa/build_pr37_stage1_assets.py tools/qa/pr37_stage1_smoke.py
      - name: Validate source WebP blobs, conservatively audit fringe for all seven, create lossless crop icons
        run: python tools/qa/build_pr37_stage1_assets.py
      - name: Commit exact artwork and generated crops to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for id in kato_hazuki yoshida_sae yamazaki_wakana watanabe_mizuki kinoshita_ami sato_eri nishimura_yumi; do
            git add "assets/ART_V2/full_body/${id}.png" "assets/ART_V2/upper_body/${id}.webp" "assets/ART_V2/face_icons/${id}.webp"
          done
          if git diff --cached --quiet; then
            echo 'No artwork changes needed; existing artifacts are deterministic'
          else
            git commit -m 'art: PR37承認済み8人の安全な輪郭処理と切り抜きアイコン16点を登録'
            git fetch origin feature/20261115-pr37-adopted7-stage1
            git rebase origin/feature/20261115-pr37-adopted7-stage1
            git push origin HEAD:feature/20261115-pr37-adopted7-stage1
          fi
      - name: Test real browser, q6 gate, interactions, bonds, image status, save and gacha invariants
        run: python tools/qa/pr37_stage1_smoke.py
      - name: Upload original-vs-cleaned matte and browser audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-pr37-stage1
          path: qa_artifacts/pr37_stage1/
          if-no-files-found: warn

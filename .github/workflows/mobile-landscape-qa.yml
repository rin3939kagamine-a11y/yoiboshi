name: QA - Mobile landscape real game
on:
  pull_request:
    paths:
      - 'tools/qa/mobile_landscape_real_smoke.py'
      - 'css/mobile_landscape_v03560_patch.css'
      - 'css/character_acting_v1.css'
      - 'index.html'
      - 'js/art_v2.js'
      - 'js/game.js'
      - 'js/q6_classic_battle_v03540.js'
      - 'css/q6_classic_battle_v03540.css'
      - 'js/battle_backgrounds_v1.js'
      - 'css/battle_backgrounds_v1.css'
      - 'tools/qa/battle_visual_real_smoke.py'
      - '.github/workflows/mobile-landscape-qa.yml'
  push:
    branches: [main]
    paths:
      - 'tools/qa/mobile_landscape_real_smoke.py'
      - 'css/mobile_landscape_v03560_patch.css'
      - 'css/character_acting_v1.css'
      - 'index.html'
      - 'js/art_v2.js'
      - 'js/game.js'
      - '.github/workflows/mobile-landscape-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run real-game mobile landscape QA
        run: python tools/qa/mobile_landscape_real_smoke.py
      - name: Run battle background and q6 layout QA
        run: python tools/qa/battle_visual_real_smoke.py
      - name: Save screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-landscape-qa
          path: |
            qa_artifacts/mobile_landscape/
            qa_artifacts/battle_visual/
          if-no-files-found: warn

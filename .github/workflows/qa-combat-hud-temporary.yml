name: Temporary combat HUD QA
on:
  push:
    branches: [feature/compact-inframe-battle-ui-20261109]
    paths:
      - .github/workflows/qa-combat-hud-temporary.yml
permissions:
  contents: read
jobs:
  viewport-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Serve game and inspect live DOM at four viewport sizes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/battle-hud-server.log 2>&1 &
          sleep 2
          node .github/qa/battle-layout-check.cjs
      - name: Keep QA screenshots if present
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: battle-hud-layout-screenshots
          path: qa-*.png
          if-no-files-found: ignore

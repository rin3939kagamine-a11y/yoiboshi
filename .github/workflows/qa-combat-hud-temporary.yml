name: Temporary combat HUD QA
on:
  push:
    branches: [feature/compact-inframe-battle-ui-20261109]
    paths:
      - .github/workflows/qa-combat-hud-temporary.yml
      - .github/qa/battle-layout-check.cjs
      - css/battle_ui_dashboard_v1.css
      - js/battle_turn_v032.js
      - js/q6_classic_battle_v03540.js
permissions:
  contents: read
jobs:
  viewport-regression:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright JavaScript API (browsers preinstalled in image)
        run: npm install --no-save --no-package-lock playwright@1.57.0
      - name: Serve game and inspect live DOM at four viewport sizes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/battle-hud-server.log 2>&1 &
          sleep 2
          node .github/qa/battle-layout-check.cjs
      - name: Keep QA screenshots if present
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: battle-hud-layout-screenshots
          path: qa-*.png
          if-no-files-found: ignore

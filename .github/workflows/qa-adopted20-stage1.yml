name: QA - 20 approved heroines stage1
on:
  push:
    branches:
      - feature/20261116-adopted20-stage1
    paths:
      - '.github/workflows/qa-adopted20-stage1.yml'
      - 'js/game.js'
      - 'js/heroines_v0920.js'
      - 'js/heroines_v0920_wire.js'
      - 'js/character_depth_v1.js'
      - 'index.html'
      - 'tools/qa/build_adopted20_stage1_assets.py'
      - 'tools/qa/adopted20_stage1_smoke.py'
      - 'assets/ART_V2/full_body/**'
      - 'assets/ART_V2/upper_body/**'
      - 'assets/ART_V2/face_icons/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage1:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image and Chromium QA dependencies
        run: |
          python -m pip install pillow==11.3.0 numpy==2.2.6 scipy==1.16.3 playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Syntax and protected source grammar
        run: |
          node --check js/game.js
          node --check js/heroines_v0920.js
          node --check js/heroines_v0920_wire.js
          node --check js/character_depth_v1.js
          python -m py_compile tools/qa/build_adopted20_stage1_assets.py tools/qa/adopted20_stage1_smoke.py
      - name: Verify adopted 20 PNG Git blobs, conservatively clean edges and white matte, produce 40 lossless crops
        run: python tools/qa/build_adopted20_stage1_assets.py
      - name: Commit all 60 art assets to stage1 PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for id in endo_saori sakaki_yura takamori_serika hamasaki_nagisa nikaido_yuki enomoto_tsugumi amase_kanata katsura_yui momose_yumeka himemiya_riria sorano_nanase nanjo_yurara komine_suzu wakakusa_rinne higuchi_rei dojima_rei amai_momo nekomiya_rara tsukino_moka asagiri_rara; do
            git add "assets/ART_V2/full_body/${id}.png" "assets/ART_V2/upper_body/${id}.webp" "assets/ART_V2/face_icons/${id}.webp"
          done
          if git diff --cached --quiet; then
            echo 'All 60 image files match deterministic verified source-derived outputs'
          else
            git commit -m 'art: 20 approved standees and 40 lossless portrait/icon crops'
            git fetch origin feature/20261116-adopted20-stage1
            git rebase origin/feature/20261116-adopted20-stage1
            git push origin HEAD:feature/20261116-adopted20-stage1
          fi
      - name: QA 20 profiles, q6 visibility, 100 bond episodes, 60 image paths, saves, unchanged gacha and portrait/landscape
        run: python tools/qa/adopted20_stage1_smoke.py
      - name: Upload provenance, image matte and browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adopted20-stage1
          path: qa_artifacts/adopted20_stage1/
          if-no-files-found: warn

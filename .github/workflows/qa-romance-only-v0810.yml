name: QA - Kaho & Ririka romance only
on:
  push:
    branches:
      - feature/20261114-kaho-ririka-romance-only
    paths:
      - 'js/heroines_v0810.js'
      - 'js/heroines_v0810_wire.js'
      - 'js/character_depth_v1.js'
      - 'js/game.js'
      - 'index.html'
      - 'tools/qa/heroine2_v0810_smoke.py'
      - '.github/workflows/qa-romance-only-v0810.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image and Chromium test dependencies
        run: |
          python -m pip install pillow==11.3.0 playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Smoke test quest-gated conversations, bond episodes, saves and gacha
        run: python tools/qa/heroine2_v0810_smoke.py
      - name: Keep screenshots and JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-romance-only-v0810
          path: qa_artifacts/heroine2_v0810/
          if-no-files-found: warn

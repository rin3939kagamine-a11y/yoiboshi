name: 2026-11-13 PR64 selective neutral-background gap cleanup
on:
  push:
    branches: [qa/20261113-independent-standee-check]
    paths: [.github/workflows/qa-20261113-pr64-gap-clean.yml]
permissions:
  contents: write
jobs:
  gap-clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet pillow numpy
      - name: Evaluate color-key cleanup restricted to hair background gaps
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,os,json
          import numpy as np
          from PIL import Image
          src=Image.open('qa/experimental/2026-11-13/pr64_v4_u2net_fullsize_CANDIDATE.png').convert('RGBA')
          a=np.array(src,dtype=np.float32)
          h,w=a.shape[:2]
          yy,xx=np.mgrid[0:h,0:w]
          rgb=a[:,:,:3]
          lo=rgb.min(axis=2); hi=rgb.max(axis=2); chroma=hi-lo
          roi=(xx>=280)&(xx<=674)&(yy>=0)&(yy<=440)
          report={}
          for key,threshold,chroma_max,soft in [
              ('v5a_strict',225,12,False),
              ('v5b_soft',210,18,True),
              ('v5c_balanced',218,16,True)]:
              edited=a.copy()
              if soft:
                  whiteness=np.clip((lo-(threshold-18))/18,0,1)
                  neutrality=np.clip((chroma_max+8-chroma)/8,0,1)
                  removal=whiteness*neutrality
              else:
                  removal=((lo>=threshold)&(chroma<=chroma_max)).astype(np.float32)
              removal*=roi
              edited[:,:,3]*=(1-removal)
              im=Image.fromarray(np.rint(edited).astype('uint8'),'RGBA')
              name='qa/experimental/2026-11-13/pr64_'+key+'_CANDIDATE.png'
              im.save(name,optimize=True)
              with open(name,'rb') as f: raw=f.read()
              report[key]={'file':name,'size':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'pixels_changed':int((removal>.01).sum())}
              sm=im.resize((384,576),Image.Resampling.LANCZOS)
              pan=Image.new('RGB',(768,576))
              for x,bg in [(0,'#101019'),(384,'#e8ebee')]:
                lay=Image.new('RGBA',(384,576),bg);lay.alpha_composite(sm);pan.paste(lay.convert('RGB'),(x,0))
              pan.save('qa/experimental/2026-11-13/'+key+'_dark_light.jpg',quality=90,optimize=True)
              sub=im.crop((210,0,725,650));lay=Image.new('RGBA',sub.size,'#101019');lay.alpha_composite(sub)
              lay.convert('RGB').resize((850,1073),Image.Resampling.LANCZOS).save('qa/experimental/2026-11-13/'+key+'_hair.jpg',quality=92,optimize=True)
          with open('qa/experimental/2026-11-13/v5_report.json','w') as f:json.dump(report,f,indent=2)
          print('V5_GAP_QA',json.dumps(report),flush=True)
          PY
      - name: Save variants to QA branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/experimental/2026-11-13/
          git diff --staged --quiet || (git commit -m "QA: trial targeted hair-background gap cleanup" && git fetch origin qa/20261113-independent-standee-check && git rebase origin/qa/20261113-independent-standee-check && git push origin HEAD:qa/20261113-independent-standee-check)

name: QA - SR costume batch4 (10 opaque silhouettes and game regression)
on:
  push:
    branches: [feature/20261117-sr-costume-batch4, main]
    paths:
      - 'js/game.js'
      - 'js/performance_v016.js'
      - 'js/heroines_sr_batch4_units.js'
      - 'index.html'
      - 'assets/UNIT_ART/*'
      - 'tools/qa/sr_batch4_*.py'
      - '.github/workflows/qa-sr-batch4.yml'
  pull_request:
    paths:
      - 'js/game.js'
      - 'js/performance_v016.js'
      - 'js/heroines_sr_batch4_units.js'
      - 'index.html'
      - 'assets/UNIT_ART/*'
      - 'tools/qa/sr_batch4_*.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  batch4:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install QA runtime
        run: python -m pip install pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.11.0.86 playwright==1.56.0
      - name: Syntax checks
        run: |
          node --check js/game.js
          node --check js/performance_v016.js
          node --check js/heroines_sr_batch4_units.js
          python -m py_compile tools/qa/sr_batch4_art.py tools/qa/sr_batch4_smoke.py
      - name: Preserve source silhouettes and QA each PNG on dark navy
        run: python tools/qa/sr_batch4_art.py
      - name: Commit only ten approved alpha WEBP assets to feature branch
        if: github.ref == 'refs/heads/feature/20261117-sr-costume-batch4' && github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for id in mimi_silver tia_staff kanon_party mikoto_stand sakura_nurse subaru_coat mira_rose nozomi_counter tomoe_diy chisato_bank; do
            git add "assets/UNIT_ART/${id}.webp"
          done
          if git diff --cached --quiet; then
            echo "No asset change"
          else
            git commit -m "art: add ten RGBA SR batch4 portraits with full opaque silhouettes"
            git push origin HEAD:feature/20261117-sr-costume-batch4
          fi
      - name: Committed assets must reproduce exactly
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: git diff --exit-code -- assets/UNIT_ART/
      - name: Browser and save/gacha regression, portrait and landscape
        run: |
          python -m playwright install --with-deps chromium
          python tools/qa/sr_batch4_smoke.py
      - name: Upload ten visual comparisons and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sr-batch4-qa
          path: qa_artifacts/sr_batch4/
          if-no-files-found: warn

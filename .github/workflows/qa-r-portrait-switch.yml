name: QA - All R-unit portraits use matching approved R outfits
on:
  push:
    branches:
      - feature/20261116-all-r-portraits
      - main
    paths:
      - '.github/workflows/qa-r-portrait-switch.yml'
      - 'js/game.js'
      - 'tools/qa/r_portrait_switch_smoke.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r-portraits:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser QA environment
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Validate unchanged game script and test code
        run: |
          node --check js/game.js
          python -m py_compile tools/qa/r_portrait_switch_smoke.py
      - name: Test every R unit portrait and all non-R regression cases
        run: python tools/qa/r_portrait_switch_smoke.py
      - name: Upload all R coverage audit and missing separate R art list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-all-r-portrait-coverage
          path: qa_artifacts/r_outfit_switch/
          if-no-files-found: warn

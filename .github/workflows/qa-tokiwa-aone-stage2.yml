name: QA - Tokiwa Aone stage2 SR unit
on:
  push:
    branches: [feature/20261115-tokiwa-aone-stage2-sr]
  pull_request:
    paths:
      - 'js/heroines_v0830_units.js'
      - 'js/game.js'
      - 'js/performance_v016.js'
      - 'index.html'
      - 'tools/qa/tokiwa_aone_stage2_smoke.py'
      - '.github/workflows/qa-tokiwa-aone-stage2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python and all JavaScript syntax
        run: |
          python -m py_compile tools/qa/tokiwa_aone_stage2_smoke.py
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Install Chromium QA dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify original save and pool behavior, new SR and exact battle effects
        run: python tools/qa/tokiwa_aone_stage2_smoke.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tokiwa-aone-stage2-qa
          path: qa_artifacts/tokiwa_aone_stage2/
          if-no-files-found: warn

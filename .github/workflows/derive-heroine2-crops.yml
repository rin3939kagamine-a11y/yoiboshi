name: Derive QA portrait crops for #81/#82
on:
  push:
    branches:
      - feature/20261114-kaho-ririka-romance-only
    paths:
      - 'tools/qa/generate_heroine2_crops.py'
      - '.github/workflows/derive-heroine2-crops.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow and crop images (sources untouched)
        run: |
          python -m pip install pillow==11.3.0
          python tools/qa/generate_heroine2_crops.py
      - name: Commit derived WebP thumbnails to Draft branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ART_V2/upper_body/sakakibara_kaho.webp assets/ART_V2/face_icons/sakakibara_kaho.webp assets/ART_V2/upper_body/minase_ririka.webp assets/ART_V2/face_icons/minase_ririka.webp
          if git diff --cached --quiet; then
            echo 'No changes to derived crops'
          else
            git commit -m 'Add derived QA thumbnails for approved Kaho and Ririka originals'
            git push origin HEAD:feature/20261114-kaho-ririka-romance-only
          fi

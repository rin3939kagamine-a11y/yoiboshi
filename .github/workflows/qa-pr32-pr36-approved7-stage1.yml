name: QA - PR32 and PR36 adopted seven heroines stage1
on:
  push:
    branches:
      - feature/20261115-pr32-pr36-approved7-stage1
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage1:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image and browser test dependencies
        run: |
          python -m pip install pillow==11.3.0 numpy==2.2.6 playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Syntax and data source tests
        run: |
          node --check js/game.js
          node --check js/heroines_v0870.js
          node --check js/heroines_v0870_wire.js
          node --check js/character_depth_v1.js
          python -m py_compile tools/qa/build_pr32_pr36_stage1_crops.py tools/qa/pr32_pr36_stage1_smoke.py
      - name: Verify approved PNG blobs and create lossless cutout WebP icons
        run: python tools/qa/build_pr32_pr36_stage1_crops.py
      - name: Commit derived icons (no generated art)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for id in aizawa_noa yukishiro_mio shiratori_yuzuha tsukishima_shino hanasaki_rena takamine_rino hoshino_emiri; do
            git add "assets/ART_V2/upper_body/${id}.webp" "assets/ART_V2/face_icons/${id}.webp"
          done
          if git diff --cached --quiet; then
            echo 'No new cutouts to commit'
          else
            git commit -m 'art: PR32/36採用7人の全身絵から切り抜いたアイコン14点を登録'
            git fetch origin feature/20261115-pr32-pr36-approved7-stage1
            git rebase origin/feature/20261115-pr32-pr36-approved7-stage1
            git push origin HEAD:feature/20261115-pr32-pr36-approved7-stage1
          fi
      - name: Test real browser, reveal gate, bonds, old save and probabilities
        run: python tools/qa/pr32_pr36_stage1_smoke.py
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-pr32-pr36-stage1
          path: qa_artifacts/pr32_pr36_stage1/
          if-no-files-found: warn

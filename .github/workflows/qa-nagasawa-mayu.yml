name: QA - Nagasawa Mayu stage1 + stage2
on:
  push:
    branches:
      - feature/20261116-nagasawa-mayu-stage1-stage2
      - main
    paths:
      - '.github/workflows/qa-nagasawa-mayu.yml'
      - 'js/game.js'
      - 'js/performance_v016.js'
      - 'js/heroines_v0940.js'
      - 'js/heroines_v0940_units.js'
      - 'js/heroines_v0940_wire.js'
      - 'js/character_depth_v1.js'
      - 'index.html'
      - 'tools/qa/build_nagasawa_mayu_assets.py'
      - 'tools/qa/nagasawa_mayu_smoke.py'
      - 'assets/ART_V2/full_body/nagasawa_mayu.png'
      - 'assets/ART_V2/upper_body/nagasawa_mayu.webp'
      - 'assets/ART_V2/face_icons/nagasawa_mayu.webp'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage1-stage2:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow and Playwright Chromium
        run: |
          python -m pip install pillow==11.3.0 playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Validate script grammar
        run: |
          node --check js/game.js
          node --check js/performance_v016.js
          node --check js/heroines_v0940.js
          node --check js/heroines_v0940_units.js
          node --check js/heroines_v0940_wire.js
          node --check js/character_depth_v1.js
          python -m py_compile tools/qa/build_nagasawa_mayu_assets.py tools/qa/nagasawa_mayu_smoke.py
      - name: Check approved source and derive two strictly lossless image crops
        run: python tools/qa/build_nagasawa_mayu_assets.py
      - name: Commit two cropped image artifacts to feature branch
        if: github.ref == 'refs/heads/feature/20261116-nagasawa-mayu-stage1-stage2'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ART_V2/upper_body/nagasawa_mayu.webp assets/ART_V2/face_icons/nagasawa_mayu.webp
          if git diff --cached --quiet; then
            echo 'The two crop files already match'
          else
            git commit -m 'art: add original-derived Mayu portrait and face crops'
            git fetch origin feature/20261116-nagasawa-mayu-stage1-stage2
            git rebase origin/feature/20261116-nagasawa-mayu-stage1-stage2
            git push origin HEAD:feature/20261116-nagasawa-mayu-stage1-stage2
          fi
      - name: Check committed image crops remain identical on main
        if: github.ref == 'refs/heads/main'
        run: git diff --exit-code -- assets/ART_V2/upper_body/nagasawa_mayu.webp assets/ART_V2/face_icons/nagasawa_mayu.webp
      - name: Browser QA portrait and landscape - q6, R unit, S1, S2, saves, gacha
        run: python tools/qa/nagasawa_mayu_smoke.py
      - name: Upload image provenance and browser QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nagasawa-mayu-stage1-stage2
          path: qa_artifacts/nagasawa_mayu/
          if-no-files-found: warn

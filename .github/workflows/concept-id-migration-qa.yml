name: QA - Concept ID migration / Ena (60 heroes)
on:
  pull_request:
    paths:
      - 'js/**'
      - 'assets/**'
      - 'sr_gallery.html'
      - 'index.html'
      - 'tools/qa/concept_id_migration_smoke.py'
      - '.github/workflows/concept-id-migration-qa.yml'
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'assets/**'
      - 'sr_gallery.html'
      - 'index.html'
      - 'tools/qa/concept_id_migration_smoke.py'
      - '.github/workflows/concept-id-migration-qa.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check all JavaScript syntax
        run: |
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check legacy IDs occur only in explicitly marked migration tables
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          rx=re.compile(r'concept(?:0[8-9]|[12][0-9]|3[0-6])')
          bad=[]
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts:
                  continue
              if rx.search(str(p)):
                  bad.append('legacy filename: '+str(p))
              if p.suffix not in {'.js','.html','.md','.txt','.json','.yml','.yaml','.css','.csv','.py'}:
                  continue
              inside_migration_table = False
              for i,line in enumerate(p.read_text(encoding='utf-8').splitlines(),1):
                  if str(p)=='CHANGELOG_CONCEPT_ID_ENA_V04920.md' and '<!-- BEGIN LEGACY_ID_MIGRATION_TABLE -->' in line:
                      inside_migration_table=True
                  if str(p)=='CHANGELOG_CONCEPT_ID_ENA_V04920.md' and '<!-- END LEGACY_ID_MIGRATION_TABLE -->' in line:
                      inside_migration_table=False
                  if not rx.search(line):continue
                  if str(p)=='CHANGELOG_CONCEPT_ID_ENA_V04920.md' and inside_migration_table:continue
                  if str(p)=='js/game.js' and 'const LEGACY_CONCEPT_IDS=Object.freeze(' in line:continue
                  if str(p)=='sr_gallery.html' and 'const GALLERY_LEGACY_UNIT_IDS=Object.freeze(' in line:continue
                  bad.append(f'{p}:{i}')
          assert not bad, '\\n'.join(bad)
          print('PASS: no unmigrated legacy IDs')
          PY
      - name: Real-browser migration and 60-member gallery
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          python tools/qa/concept_id_migration_smoke.py

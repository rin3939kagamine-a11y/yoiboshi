name: QA - PR59 adopted 4 heroines stage1
on:
  push:
    branches:
      - feature/20261115-pr59-approved4-stage1
    paths:
      - 'js/game.js'
      - 'js/character_depth_v1.js'
      - 'js/heroines_v0860.js'
      - 'js/heroines_v0860_wire.js'
      - 'index.html'
      - 'assets/ART_V2/full_body/takamiya_sayaka.png'
      - 'assets/ART_V2/full_body/shirase_marika.png'
      - 'assets/ART_V2/full_body/miyoshi_nanami.png'
      - 'assets/ART_V2/full_body/hayase_rio.png'
      - 'tools/qa/build_pr59_stage1_crops.py'
      - 'tools/qa/pr59_stage1_smoke.py'
      - 'tools/qa/concept_id_migration_smoke.py'
      - 'tools/qa/heroines_v0500_smoke.py'
      - 'tools/qa/character_depth_real_smoke.py'
      - 'docs/new_character_ideas/2026-11-15_pr59_approved4/STAGE1_QA.md'
      - '.github/workflows/qa-pr59-approved4-stage1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runtime and image processing dependencies
        run: |
          python -m pip install pillow==11.3.0 numpy==2.2.6 scipy==1.15.3 playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: JavaScript/Python syntax and stage 1 scope
        run: |
          node --check js/game.js
          node --check js/heroines_v0860.js
          node --check js/heroines_v0860_wire.js
          node --check js/character_depth_v1.js
          python -m py_compile tools/qa/build_pr59_stage1_crops.py tools/qa/pr59_stage1_smoke.py
          python -m py_compile tools/qa/concept_id_migration_smoke.py tools/qa/heroines_v0500_smoke.py tools/qa/character_depth_real_smoke.py
      - name: Verify source PNGs, optionally de-fringe 04, render light/dark and crop lossless WebP
        run: python tools/qa/build_pr59_stage1_crops.py
      - name: Upload derived image crops and permitted edge-only correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for id in takamiya_sayaka shirase_marika miyoshi_nanami hayase_rio; do
            git add "assets/ART_V2/upper_body/${id}.webp" "assets/ART_V2/face_icons/${id}.webp"
          done
          git add assets/ART_V2/full_body/hayase_rio.png
          if git diff --cached --quiet; then
            echo 'No derived image changes to register'
          else
            git commit -m 'art: PR59採用4人の切り抜き8点と許容範囲の輪郭色補正を登録'
            git push origin HEAD:feature/20261115-pr59-approved4-stage1
          fi
      - name: Run actual-game Chromium QA in portrait/landscape with light/dark backgrounds
        run: python tools/qa/pr59_stage1_smoke.py
      - name: Upload QA and light/dark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-pr59-approved4-stage1
          path: qa_artifacts/pr59_stage1/
          if-no-files-found: warn

name: QA - Tokiwa Aone romance only
on:
  push:
    branches:
      - feature/20261115-tokiwa-aone-romance-only
    paths:
      - 'js/game.js'
      - 'js/heroines_v0830.js'
      - 'js/heroines_v0830_wire.js'
      - 'js/character_depth_v1.js'
      - 'index.html'
      - 'tools/qa/tokiwa_aone_romance_smoke.py'
      - '.github/workflows/qa-tokiwa-aone-romance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install pillow==11.3.0 playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Chromium old-save, odds, no unit, quest gate, five bonds, and mobile rendering
        run: python tools/qa/tokiwa_aone_romance_smoke.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-tokiwa-aone
          path: qa_artifacts/tokiwa_aone/
          if-no-files-found: warn

name: QA - PR58 eight adopted SR units stage2
on:
  push:
    branches:
      - feature/20261115-pr58-stage2-8-sr
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage2:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser tools
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Validate JS and Python syntax
        run: |
          node --check js/heroines_v0890_units.js
          node --check js/performance_v016.js
          node --check js/game.js
          python -m py_compile tools/qa/pr58_stage2_smoke.py
      - name: Validate 8 units and 16 live skills in both orientations
        run: python tools/qa/pr58_stage2_smoke.py
      - name: Upload browser QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-pr58-stage2
          path: qa_artifacts/pr58_stage2/
          if-no-files-found: warn

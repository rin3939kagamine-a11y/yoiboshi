name: QA - five approved R heroines v0950
on:
  push:
    branches:
      - feature/20261116-five-new-r-v0950
      - main
    paths:
      - '.github/workflows/qa-five-r-v0950.yml'
      - 'js/game.js'
      - 'js/performance_v016.js'
      - 'js/character_depth_v1.js'
      - 'js/heroines_v0950*.js'
      - 'index.html'
      - 'tools/qa/five_r_v0950_*.py'
      - 'assets/ART_V2/full_body/*'
      - 'assets/ART_V2/upper_body/*'
      - 'assets/ART_V2/face_icons/*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  five-r-stage1-stage2:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow and Playwright
        run: |
          python -m pip install pillow==11.3.0 playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: JavaScript and Python grammar checks
        run: |
          node --check js/game.js
          node --check js/performance_v016.js
          node --check js/heroines_v0950.js
          node --check js/heroines_v0950_units.js
          node --check js/heroines_v0950_wire.js
          node --check js/character_depth_v1.js
          python -m py_compile tools/qa/five_r_v0950_art.py tools/qa/five_r_v0950_smoke.py
      - name: Verify Git blobs, preserve original full bodies, derive ten lossless crops
        run: python tools/qa/five_r_v0950_art.py
      - name: Commit source-derived crops and optional blue alpha correction
        if: github.ref == 'refs/heads/feature/20261116-five-new-r-v0950'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for id in shiromiya_kotori hayakawa_aoba suzumiya_mia yumemiya_yua tsukimiya_ayaka; do
            git add "assets/ART_V2/full_body/${id}.png" "assets/ART_V2/upper_body/${id}.webp" "assets/ART_V2/face_icons/${id}.webp"
          done
          if git diff --cached --quiet; then
            echo 'Image artifacts unchanged'
          else
            git commit -m 'art: preserve five source standees and create ten lossless crops'
            git fetch origin feature/20261116-five-new-r-v0950
            git rebase origin/feature/20261116-five-new-r-v0950
            git push origin HEAD:feature/20261116-five-new-r-v0950
          fi
      - name: Main must contain committed crops
        if: github.ref == 'refs/heads/main'
        run: git diff --exit-code -- assets/ART_V2/full_body/ assets/ART_V2/upper_body/ assets/ART_V2/face_icons/
      - name: Browser QA in portrait and landscape; mechanics, q6, gacha, save
        run: python tools/qa/five_r_v0950_smoke.py
      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-r-v0950-qa
          path: qa_artifacts/five_r_v0950/
          if-no-files-found: warn

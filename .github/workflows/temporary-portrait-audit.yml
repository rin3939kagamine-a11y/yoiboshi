name: Temporary audit - all current character portraits
on:
  pull_request:
    paths:
      - '.github/workflows/temporary-portrait-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: python -m pip install Pillow
      - name: Build original-asset audit package and 56 portrait contact sheets
        run: |
          mkdir -p qa_portraits/current
          cp assets/ART_V2/full_body/*.webp qa_portraits/current/
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageOps, ImageStat
          from pathlib import Path
          import json, statistics
          root=Path('qa_portraits')
          fs=sorted((root/'current').glob('*.webp'))
          font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',18)
          rows=[]
          def sheet(kind):
              for page in range((len(fs)+19)//20):
                  subset=fs[page*20:(page+1)*20]
                  w,h=275,400 if kind=='full' else 255
                  tile=Image.new('RGB',(w*5,h*4),(230,230,230))
                  d=ImageDraw.Draw(tile)
                  for n,p in enumerate(subset):
                      im=Image.open(p).convert('RGBA')
                      if kind=='faces':
                          # Consistent top ~45% crop, not face detection
                          im=im.crop((0,0,im.width,int(im.height*.45)))
                      bg=Image.new('RGBA',im.size,(245,245,245,255))
                      bg.alpha_composite(im)
                      thumb=ImageOps.contain(bg.convert('RGB'),(w-12,h-40))
                      x=(n%5)*w+(w-thumb.width)//2
                      y=(n//5)*h+(h-40-thumb.height)//2+20
                      tile.paste(thumb,(x,y))
                      d.text(((n%5)*w+9,(n//5)*h+2),p.stem,fill=(0,0,0),font=font)
                  tile.save(root/f'{kind}_{page+1}.jpg',quality=90)
          for p in fs:
              im=Image.open(p)
              rgba=im.convert('RGBA')
              rgba.thumbnail((190,300))
              rgb=Image.new('RGB',rgba.size,(245,245,245))
              rgb.paste(rgba,mask=rgba.getchannel('A'))
              stat=ImageStat.Stat(rgb)
              rows.append(dict(id=p.stem,original_width=im.width,original_height=im.height,
                               mode=im.mode,bytes=p.stat().st_size,
                               mean_rgb=[round(x,1) for x in stat.mean[:3]]))
          sheet('full');sheet('faces')
          (root/'manifest.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          print('PORTRAIT_COUNT',len(fs))
          print('SHEETS',sorted(p.name for p in root.glob('*.jpg')))
          PY
      - name: Also audit actual dialogue expression sprites and portrait upper-bodies
        run: |
          mkdir -p qa_portraits/expression_normal qa_portraits/upper_body qa_portraits/story_cast
          cp assets/ART_V2/expressions/*_normal.webp qa_portraits/expression_normal/
          cp assets/ART_V2/upper_body/*.webp qa_portraits/upper_body/
          cp assets/ART_V2/story_cast/*_talk.webp qa_portraits/story_cast/
          python - <<'PY'
          from PIL import Image,ImageOps,ImageDraw,ImageFont
          from pathlib import Path
          import json
          root=Path('qa_portraits')
          font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',18)
          results={}
          for cat in ['expression_normal','upper_body','story_cast']:
            files=sorted((root/cat).glob('*.webp'))
            results[cat]=[{'name':p.name,'dims':Image.open(p).size,'mode':Image.open(p).mode} for p in files]
            for page in range((len(files)+19)//20):
              subset=files[page*20:(page+1)*20]
              w,h=270,320
              sheet=Image.new('RGB',(w*5,h*4),'#dedede')
              d=ImageDraw.Draw(sheet)
              for i,p in enumerate(subset):
                im=Image.open(p).convert('RGBA')
                bg=Image.new('RGBA',im.size,(245,245,245,255));bg.alpha_composite(im)
                th=ImageOps.contain(bg.convert('RGB'),(w-14,h-37))
                x=(i%5)*w+(w-th.width)//2
                y=(i//5)*h+(h-37-th.height)//2+23
                sheet.paste(th,(x,y))
                d.text(((i%5)*w+7,(i//5)*h+3),p.stem.replace('_normal',''),fill='black',font=font)
              sheet.save(root/f'{cat}_{page+1}.jpg',quality=90)
          (root/'sprite_manifest.json').write_text(json.dumps(results,indent=2))
          print({k:len(v) for k,v in results.items()})
          PY
      - name: Upload comparison sheets and latest original sprites
        uses: actions/upload-artifact@v4
        with:
          name: full-body-character-visual-audit
          path: qa_portraits/
          retention-days: 3

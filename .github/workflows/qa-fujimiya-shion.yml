name: QA - Fujimiya Shion stage1 + stage2
on:
  push:
    branches:
      - feature/20261116-fujimiya-shion-stage1-stage2
      - main
    paths:
      - '.github/workflows/qa-fujimiya-shion.yml'
      - 'js/game.js'
      - 'js/performance_v016.js'
      - 'js/heroines_v0930.js'
      - 'js/heroines_v0930_units.js'
      - 'js/heroines_v0930_wire.js'
      - 'js/character_depth_v1.js'
      - 'index.html'
      - 'tools/qa/build_fujimiya_shion_assets.py'
      - 'tools/qa/fujimiya_shion_smoke.py'
      - 'tools/qa/adopted20_stage2_smoke.py'
      - 'assets/ART_V2/full_body/fujimiya_shion.png'
      - 'assets/ART_V2/upper_body/fujimiya_shion.webp'
      - 'assets/ART_V2/face_icons/fujimiya_shion.webp'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage1-stage2:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow and Playwright Chromium
        run: |
          python -m pip install pillow==11.3.0 playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Check JavaScript and Python syntax
        run: |
          node --check js/game.js
          node --check js/performance_v016.js
          node --check js/heroines_v0930.js
          node --check js/heroines_v0930_units.js
          node --check js/heroines_v0930_wire.js
          node --check js/character_depth_v1.js
          python -m py_compile tools/qa/build_fujimiya_shion_assets.py tools/qa/fujimiya_shion_smoke.py
      - name: Verify original source PNG exact blob and extract two lossless crops
        run: python tools/qa/build_fujimiya_shion_assets.py
      - name: Commit the two lossless crops to the feature branch only
        if: github.ref == 'refs/heads/feature/20261116-fujimiya-shion-stage1-stage2'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ART_V2/upper_body/fujimiya_shion.webp assets/ART_V2/face_icons/fujimiya_shion.webp
          if git diff --cached --quiet; then
            echo 'Both source-derived crops are already identical'
          else
            git commit -m 'art: crop Fujimiya Shion original PNG without altering pixels'
            git fetch origin feature/20261116-fujimiya-shion-stage1-stage2
            git rebase origin/feature/20261116-fujimiya-shion-stage1-stage2
            git push origin HEAD:feature/20261116-fujimiya-shion-stage1-stage2
          fi
      - name: Verify committed crops on main do not differ
        if: github.ref == 'refs/heads/main'
        run: git diff --exit-code -- assets/ART_V2/upper_body/fujimiya_shion.webp assets/ART_V2/face_icons/fujimiya_shion.webp
      - name: Real browser QA portrait and landscape - profile, skills, q6, save, old units
        run: python tools/qa/fujimiya_shion_smoke.py
      - name: Upload binary provenance and browser QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-fujimiya-shion-stage1-stage2
          path: qa_artifacts/fujimiya_shion/
          if-no-files-found: warn

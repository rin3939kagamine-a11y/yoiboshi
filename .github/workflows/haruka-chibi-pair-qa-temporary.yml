name: Haruka genuine and fake chibi QA (temporary)
on:
  push:
    branches: [feature/haruka-genuine-impostor-chibi-20261109]
    paths:
      - .github/workflows/haruka-chibi-pair-qa-temporary.yml
      - .github/qa/haruka-chibi-pair.cjs
      - js/chibi_bridge_v03321.js
      - index.html
permissions:
  contents: read
jobs:
  test-pair:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.57.0
      - name: Check PNG file dimensions alpha and original hashes
        shell: bash
        run: |
          set -euo pipefail
          echo 'f4cdf690d5c24799097105c0b9e1535ab704cadb4ad2cf7d5eda5a1d0541c99e  assets/ART_V2/chibi/haruka_npc_real.png' | sha256sum -c -
          echo '5afbbee5c018a811d4f0f999a33094e66fc27347fffb69f728a9dcb61303baed  assets/ART_V2/chibi/haruka_npc_fake.png' | sha256sum -c -
          python3 - <<'PY'
          import struct
          for p in ['assets/ART_V2/chibi/haruka_npc_real.png','assets/ART_V2/chibi/haruka_npc_fake.png']:
              data=open(p,'rb').read(26)
              assert data[:8]==b'\x89PNG\r\n\x1a\n'
              width,height=struct.unpack('>II',data[16:24])
              assert (width,height)==(1254,1254),(p,width,height)
              assert data[25]==6,(p,'not RGBA PNG',data[25])
              print(p,width,height,'RGBA')
          PY
      - name: Test q24 real and future fake identity without changing storyline
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/haruka-qa.log 2>&1 &
          sleep 2
          node .github/qa/haruka-chibi-pair.cjs
      - name: Save QA screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haruka-genuine-and-impostor-qa
          path: qa-haruka-*.png
          if-no-files-found: ignore

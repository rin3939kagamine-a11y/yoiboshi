name: QA - Singles12 final SR units stage2
on:
  push:
    branches:
      - feature/20261115-singles12-stage2-sr
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage2:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser tools
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Validate JS and Python syntax
        run: |
          node --check js/heroines_v0910_units.js
          node --check js/performance_v016.js
          node --check js/game.js
          python -m py_compile tools/qa/singles12_stage2_smoke.py
      - name: Verify all 12 SR units and 24 live skills in portrait and landscape
        run: python tools/qa/singles12_stage2_smoke.py
      - name: Upload browser QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-singles12-stage2
          path: qa_artifacts/singles12_stage2/
          if-no-files-found: warn

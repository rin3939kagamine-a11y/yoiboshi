name: Temporary battle HUD readability QA
on:
  push:
    branches: [feature/battle-visual-readability-20261109]
    paths:
      - .github/workflows/qa-battle-readability-temporary.yml
      - .github/qa/battle-readability.cjs
      - css/battle_readability_v1.css
      - index.html
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.57.0
      - name: Render battle UI and test dimensions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/battle-web.log 2>&1 &
          sleep 2
          node .github/qa/battle-readability.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: battle-readability-screenshots
          path: qa-*.png
          if-no-files-found: ignore

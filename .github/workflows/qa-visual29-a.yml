name: QA - Visual29 A Route
on:
  push:
    branches:
      - feature/20261115-visual29-existing-people-cleanup
    paths:
      - 'js/game.js'
      - 'tools/qa/visual29_existing_names_smoke.py'
      - '.github/workflows/qa-visual29-a.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify 29 official romance names in Chromium portrait and landscape
        run: python tools/qa/visual29_existing_names_smoke.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-visual29-a
          path: qa_artifacts/visual29/
          if-no-files-found: warn

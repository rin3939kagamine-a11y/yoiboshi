name: PR64 transparent candidate (provisional only)
on:
  push:
    branches:
      - art/20261111-pink-underlayer-standee
    paths:
      - .github/workflows/pr64-transparent-candidate.yml
permissions:
  contents: write
jobs:
  propose-transparent-png:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image processing dependencies
        run: python -m pip install --disable-pip-version-check "rembg[cpu]" pillow
      - name: Verify original, prepare a separate provisional candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import hashlib, subprocess
          from PIL import Image
          from rembg import remove, new_session
          root = Path("assets/provisional/2026-11-11_pink_underlayer_standee/full_body")
          src = root / "pink_underlayer_black_street_v1.png"
          dst = root / "pink_underlayer_black_street_v2_transparency_CANDIDATE.png"
          data = src.read_bytes()
          expected_sha256 = "edba2b78575fd1ebfb713c47729ef35aeb24b68ff4e65ccb263842cf18099e4c"
          expected_git_blob = "bd21d625502f298b862fa954276e04eea9551b8b"
          assert hashlib.sha256(data).hexdigest() == expected_sha256, "original SHA-256 mismatch"
          git_blob = subprocess.check_output(["git", "hash-object", str(src)], text=True).strip()
          assert git_blob == expected_git_blob, "original Git blob mismatch"
          im = Image.open(BytesIO(data))
          assert im.size == (1024, 1536) and im.mode == "RGB", (im.size, im.mode)
          assert not dst.exists(), "candidate already exists: manual review needed"
          result = remove(data, session=new_session("u2netp"), alpha_matting=False)
          candidate = Image.open(BytesIO(result)).convert("RGBA")
          assert candidate.size == im.size
          a = candidate.getchannel("A")
          lo, hi = a.getextrema()
          assert lo == 0 and hi == 255, f"alpha not mixed transparency: {lo},{hi}"
          w,h=candidate.size
          for xy in ((0,0), (w-1,0), (0,h-1), (w-1,h-1)):
              assert a.getpixel(xy) == 0, f"corner not transparent: {xy}"
          candidate.save(dst, format="PNG", optimize=True)
          print("ORIGINAL SHA-256", hashlib.sha256(data).hexdigest())
          print("ORIGINAL GIT BLOB", git_blob)
          print("CANDIDATE SHA-256", hashlib.sha256(dst.read_bytes()).hexdigest())
          print("CANDIDATE SIZE", candidate.size, "MODE", candidate.mode, "ALPHA", (lo,hi))
          print("IMPORTANT: mechanical validation ONLY; human GitHub preview and in-game QA NOT completed")
          PY
      - name: Commit candidate, remove one-shot workflow; do NOT merge
        run: |
          set -euo pipefail
          FILE="assets/provisional/2026-11-11_pink_underlayer_standee/full_body/pink_underlayer_black_street_v2_transparency_CANDIDATE.png"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$FILE"
          git rm -- ".github/workflows/pr64-transparent-candidate.yml"
          git commit -m "PR #64: add provisional transparency candidate (visual QA pending)"
          git push origin HEAD:art/20261111-pink-underlayer-standee

name: Import three approved existing standees (no image generation)
on:
  pull_request:
    paths:
      - 'tools/qa/import_five_approved_assets.py'
      - '.github/workflows/import-three-approved-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-art:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Revalidate three WebP sizes (74-person format)
        id: gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          from struct import unpack
          # CI regenerates only on changes; the importer verifies Pillow and all bytes.
          # Always rerun conversion after this workflow change to ensure exact canvas dimensions.
          print('already=false')
          PY
      - name: Install Pillow for lossless image encoding
        if: steps.gate.outputs.already == 'false'
        run: python -m pip install 'Pillow>=11,<13'
      - name: Re-read exact original images, verify, convert without redrawing
        if: steps.gate.outputs.already == 'false'
        run: python tools/qa/import_three_approved_assets.py
      - name: Commit three verified original files and nine display WEBPs
        if: steps.gate.outputs.already == 'false'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ART_V2/source_originals/3_approved_20261112/
          for dir in full_body upper_body face_icons; do
            for id in sumika reika hono; do
              git add "assets/ART_V2/$dir/$id.webp"
            done
          done
          if git diff --staged --quiet; then echo 'Verified three assets already normalized'; exit 0; fi
          git commit -m 'Normalize three approved WebP renderings to existing 74-person format'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}

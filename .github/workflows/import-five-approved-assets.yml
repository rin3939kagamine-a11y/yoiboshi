name: Import five approved existing standees (no image generation)
on:
  pull_request:
    paths:
      - 'tools/qa/import_five_approved_assets.py'
      - '.github/workflows/import-five-approved-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-art:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ensure 5 art imports are not already done
        id: gate
        run: |
          if test -f assets/ART_V2/full_body/sumika.webp; then
            echo 'already=true' >> "$GITHUB_OUTPUT"
          else
            echo 'already=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install Pillow for lossless image encoding
        if: steps.gate.outputs.already == 'false'
        run: python -m pip install 'Pillow>=11,<13'
      - name: Re-read exact original images, verify, convert without redrawing
        if: steps.gate.outputs.already == 'false'
        run: python tools/qa/import_five_approved_assets.py
      - name: Commit five verified original files and fifteen display WEBPs
        if: steps.gate.outputs.already == 'false'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ART_V2/source_originals/5_approved_20261112/
          for dir in full_body upper_body face_icons; do
            for id in sumika elma nono reika hono; do
              git add "assets/ART_V2/$dir/$id.webp"
            done
          done
          git commit -m 'Import approved original PNGs and lossless WebP renderings for five SR heroines'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}

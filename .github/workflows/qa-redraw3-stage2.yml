name: QA - Redraw3 stage2 SR units and combat
on:
  push:
    branches:
      - feature/20261115-redraw3-stage2-sr
    paths:
      - 'js/game.js'
      - 'js/performance_v016.js'
      - 'js/heroines_v0850_units.js'
      - 'index.html'
      - 'tools/qa/redraw3_stage2_smoke.py'
      - 'tools/qa/suzuha_renka_stage2_smoke.py'
      - 'tools/qa/tokiwa_aone_stage2_smoke.py'
      - '.github/workflows/qa-redraw3-stage2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare Chromium runtime
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify code and test syntax
        run: |
          node --check js/game.js
          node --check js/performance_v016.js
          node --check js/heroines_v0850_units.js
          python -m py_compile tools/qa/redraw3_stage2_smoke.py
          python -m py_compile tools/qa/suzuha_renka_stage2_smoke.py
          python -m py_compile tools/qa/tokiwa_aone_stage2_smoke.py
      - name: Verify three SR units in real battle and old save/odds regression, portrait and landscape
        run: python tools/qa/redraw3_stage2_smoke.py
      - name: Attach screenshots and battle calculation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-redraw3-stage2-sr
          path: qa_artifacts/redraw3_stage2/
          if-no-files-found: warn
